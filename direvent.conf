debug 0;
foreground true;

# SCM watchers
watcher {
    path .;
    event (create, write, delete);
    file (
      "/.*\\.scm/i",
    );
    option (stdout, stderr, shell, wait);
    max-instances 1;
    command "maak test";
    timeout 15;    
}

watcher {
    path ./src/veritas;
    event (create, write, delete);
    file (
      "/.*\\.scm/i"
    );
    option (stdout, stderr, shell, wait);
    max-instances 1;
    command "cd ../../ && maak test";
    timeout 15;
}

watcher {
    path ./test/veritas/unit;
    event (create, write, delete);
    file (
      "/.*\\.scm/i"
    );
    option (stdout, stderr, shell, wait);
    max-instances 1;
    command "cd ../../../ && maak test";
    timeout 15;
}

